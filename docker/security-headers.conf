# Security headers for the web app (spec §40). Included in every location that sets its own
# headers, because nginx does not inherit add_header into a location that has any.
#
# Content-Security-Policy:
# - scripts only from this origin: no inline scripts, no eval, no third-party code;
# - styles from this origin plus inline style attributes (charts and the dependency map
#   position elements with style="…"); no remote stylesheets;
# - fonts and images from this origin (data: for small inlined assets);
# - connections (REST and the Socket.IO WebSocket) only to this origin;
# - never framed (clickjacking), no plugins, forms and <base> only to this origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
