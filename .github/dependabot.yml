# Weekly dependency update pull requests; CI checks each one before it can be merged.
#
# Major versions (Node 22 → 26, Prisma 6 → 7, …) carry breaking changes and are upgraded
# deliberately, by hand, so Dependabot only proposes minor and patch updates for packages and
# base images. Each ecosystem's updates arrive grouped in one pull request a week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      docker-images:
        patterns: ['*']
