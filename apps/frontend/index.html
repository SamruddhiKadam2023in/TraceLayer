<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TraceLayer — API reliability and observability platform" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TraceLayer</title>
    <script>
      // Apply the persisted theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('tracelayer-theme') || '{}');
          var pref = (stored.state && stored.state.theme) || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
